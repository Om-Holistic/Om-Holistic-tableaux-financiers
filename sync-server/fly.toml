# Serveur de synchronisation d'Om Finances (déployé par .github/workflows/sync-server.yml).
app = "om-holistic-finances-sync"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  ALLOWED_ORIGINS = "https://om-holistic.github.io"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "om_sync_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
